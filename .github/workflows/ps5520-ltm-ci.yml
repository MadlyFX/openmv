name: PS5520 LTM test build
on:
  push:
    branches: [codex/ps5520-ltm-ci]
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: openmv/uncrustify-action@v1
        with:
          config-path: tools/uncrustify.cfg
          extensions: c,cc,h
          fail-on-error: false
          uncrustify-version: '0.75.0'
      - name: Format changed C files
        run: |
          uncrustify -q -c tools/uncrustify.cfg --no-backup common/omv_csi.h drivers/sensors/ps5520.c modules/py_csi_ng.c
          git diff --stat
      - uses: actions/upload-artifact@v4
        with:
          name: ltm-formatted-source
          path: |
            common/omv_csi.h
            drivers/sensors/ps5520.c
            modules/py_csi_ng.c
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch submodules
        run: source tools/ci.sh && ci_update_submodules
      - name: Cache SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/openmv-sdk-1.7.3
          key: openmv-sdk-1.7.3-linux-x86_64
      - name: Install SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: source tools/ci.sh && ci_install_sdk
      - name: Build N6 firmware
        run: source tools/ci.sh && ci_build_target OPENMV_N6 false 0 true
      - name: Upload N6 firmware
        uses: actions/upload-artifact@v4
        with:
          name: ltm-n6
          path: OPENMV_N6/
          if-no-files-found: error
